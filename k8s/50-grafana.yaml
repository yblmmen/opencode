apiVersion: v1
kind: ConfigMap
metadata: {name: lifecycle-grafana-provision, namespace: opencode}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Lifecycle-Prometheus
        type: prometheus
        uid: lifecycle-prom
        access: proxy
        url: http://lifecycle-prometheus.opencode.svc.cluster.local:9090
        isDefault: true
      - name: Hubble-Flow-API
        type: yesoreyeram-infinity-datasource
        uid: lifecycle-flow
        access: proxy
        jsonData:
          allowedHosts:
            - http://https-dashboard.opencode.svc.cluster.local:8080
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Hubble Flow
        orgId: 1
        folder: OpenCode
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/lifecycle-dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lifecycle-grafana, namespace: opencode}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: lifecycle-grafana}}
  template:
    metadata: {labels: {app: lifecycle-grafana}}
    spec:
      nodeSelector: {kubernetes.io/hostname: master1}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        - {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}
      automountServiceAccountToken: false
      securityContext: {runAsUser: 472, runAsGroup: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: local/lifecycle-grafana:v2
          imagePullPolicy: Never
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: lifecycle-grafana-admin, key: password}}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'false'}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 10, initialDelaySeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: '1', memory: 1Gi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provision, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: provision, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboard, mountPath: /etc/grafana/lifecycle-dashboards, readOnly: true}
      volumes:
        - {name: data, hostPath: {path: /opt/opencode/grafana-data, type: Directory}}
        - {name: provision, configMap: {name: lifecycle-grafana-provision}}
        - {name: dashboard, configMap: {name: lifecycle-grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: lifecycle-grafana, namespace: opencode}
spec:
  type: NodePort
  selector: {app: lifecycle-grafana}
  ports: [{name: http, protocol: TCP, port: 3000, targetPort: 3000, nodePort: 31300}]
